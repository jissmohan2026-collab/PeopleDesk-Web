{% extends "base.html" %}

{% block title %}Contact Us - ATS{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold mb-3">{{ _('Contact Us') }}</h1>
                <p class="lead text-muted">{{ _('We are here to help! Reach out to us for any queries or support regarding your applications.') }}</p>
            </div>
            
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                <form action="#" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">{{ _('Full Name') }}</label>
                            <input type="text" class="form-control form-control-lg" id="name" placeholder="{{ _('John Doe') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">{{ _('Email address') }}</label>
                            <input type="email" class="form-control form-control-lg" id="email" placeholder="{{ _('name@example.com') }}" required>
                        </div>
                        <div class="col-12">
                            <label for="subject" class="form-label">{{ _('Subject') }}</label>
                            <input type="text" class="form-control form-control-lg" id="subject" placeholder="{{ _('How can we help you?') }}" required>
                        </div>
                        <div class="col-12">
                            <label for="message" class="form-label">{{ _('Message') }}</label>
                            <textarea class="form-control form-control-lg" id="message" rows="5" placeholder="{{ _('Enter your message here...') }}" required></textarea>
                        </div>
                        <div class="col-12 mt-4 text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-5">{{ _('Send Message') }}</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
