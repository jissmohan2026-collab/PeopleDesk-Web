{% extends 'base.html' %}
{% block title %}Login - ATS{% endblock %}
{% block content %}
<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-circle text-primary mb-3" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold">{{ _('Welcome Back') }}</h3>
                        <p class="text-muted">{{ _('Login to access your dashboard') }}</p>
                    </div>
                    
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">{{ _('Username') }}</label>
                            <input type="text" name="username" class="form-control form-control-lg bg-light border-0" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">{{ _('Password') }}</label>
                            <input type="password" name="password" class="form-control form-control-lg bg-light border-0" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">{{ _('Login') }}</button>
                    </form>
                    <div class="text-center">
                        <p class="text-muted">{{ _('Don\'t have an account?') }} <a href="{{ url_for('register') }}" class="text-decoration-none">{{ _('Register here') }}</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
