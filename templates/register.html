{% extends 'base.html' %}
{% block title %}Register - ATS{% endblock %}
{% block content %}
<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-plus text-primary mb-3" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold">Create an Account</h3>
                        <p class="text-muted">Register to submit and track applications easily</p>
                    </div>
                    
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg bg-light border-0" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg bg-light border-0" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Register</button>
                    </form>
                    <div class="text-center">
                        <p class="text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
